name: contracts
# Pipeline de contratos (Deber 2): 1 valida YAML/schemas, 2 genera docs, 3 prueba API y eventos contra el contrato,
# 4 bloquea cambios incompatibles. Cada job falla (exit != 0) ante cualquier discrepancia => el PR queda bloqueado.
# Marcar los 4 jobs como "required status checks" en la proteccion de la rama main.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:                                # 1. VALIDA: OpenAPI, AsyncAPI, JSON Schemas y ejemplos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: OpenAPI - redocly lint
        run: bash scripts/validate-contracts.sh openapi
      - name: AsyncAPI - asyncapi validate
        run: bash scripts/validate-contracts.sh asyncapi
      - name: JSON Schema - ajv compile (draft 2020-12)
        run: bash scripts/validate-contracts.sh schemas
      - name: Ejemplos - validos pasan, invalidos fallan
        run: bash scripts/validate-contracts.sh examples

  docs:                                # 2. GENERA: documentacion HTML navegable (artefacto)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Redoc (OpenAPI)
        run: npx --yes @redocly/cli@1.34.24 build-docs contracts/openapi.yaml -o contracts-docs/openapi.html
      - name: AsyncAPI HTML
        run: npx --yes @asyncapi/cli@6.3.1 generate fromTemplate contracts/asyncapi.yaml @asyncapi/html-template@3.5.4 -o contracts-docs/asyncapi --force-write
      - uses: actions/upload-artifact@v4
        with:
          name: contracts-docs
          path: contracts-docs

  contract-tests:                      # 3. PRUEBA API + 4. PRUEBA EVENTO (JUnit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      # HttpContractTest (peticiones/respuestas vs openapi.yaml), OpenApiContractTest, EventContractTest (sobres reales
      # vs JSON Schema + ejemplos validos/invalidos), AsyncApiConsistencyTest (topologia real vs asyncapi.yaml)
      - name: Pruebas de contrato
        run: >
          mvn -B test
          -Dtest='OpenApiContractTest,HttpContractTest,EventContractTest,AsyncApiConsistencyTest,OutboxPublisherLegacyKeysTest'
          -Dsurefire.failIfNoSpecifiedTests=false
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contract-test-reports
          path: target/surefire-reports

  compatibility:                       # 5. BLOQUEA: cambio incompatible en v1 respecto a la rama base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }       # necesita la historia para comparar con la rama base
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Reporte de compatibilidad (oasdiff + schemas)
        env:
          BASE_REF_NAME: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF_NAME" ]; then
            BASE="origin/$BASE_REF_NAME"                 # pull_request: contra la rama destino
          elif git rev-parse --verify -q HEAD~1 >/dev/null; then
            BASE="HEAD~1"                                # push a main: contra el commit anterior
          else
            echo "Primer commit del repositorio: no hay linea base."; exit 0
          fi
          echo "Comparando contra $BASE"
          bash scripts/compat-report.sh "$BASE"          # exit 1 si hay cambios incompatibles; ademas escribe $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contracts-compat-report
          path: target/compat-report.md
